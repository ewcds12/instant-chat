openapi: 3.1.0
info:
  title: Instant Chat API
  version: 0.3.0
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API and database health
      responses:
        "200":
          description: API and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: API is running but its database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/register:
    post:
      operationId: register
      summary: Create an account and initial session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "409":
          description: An account already uses the email address or username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with an email address and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke an access and refresh token pair
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Session revoked
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the user for the current access token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/search:
    get:
      operationId: searchUserByUsername
      summary: Find one account by exact username
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Username"
      responses:
        "200":
          description: Exact username match
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /contact-requests:
    get:
      operationId: listContactRequests
      summary: List incoming and outgoing pending contact requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending contact requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequestLists"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: sendContactRequest
      summary: Send a contact request by exact username
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendContactRequest"
      responses:
        "201":
          description: Contact request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequest"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /contact-requests/{request_id}/accept:
    post:
      operationId: acceptContactRequest
      summary: Accept an incoming contact request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Accepted contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /contact-requests/{request_id}/reject:
    post:
      operationId: rejectContactRequest
      summary: Reject an incoming contact request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "204":
          description: Contact request rejected
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /contacts:
    get:
      operationId: listContacts
      summary: List accepted contacts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accepted contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /contacts/{user_id}:
    delete:
      operationId: removeContact
      summary: Remove an accepted contact
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Contact removed
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations:
    get:
      operationId: listConversations
      summary: List direct conversations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Direct conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createDirectConversation
      summary: Create or return the direct conversation for a contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "200":
          description: Existing direct conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "201":
          description: Direct conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RequestID:
      name: request_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceID"
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceID"
  responses:
    InvalidArgument:
      description: The request body or fields are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Credentials or a session token are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated account cannot perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current relationship state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests from this IP address
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before another attempt should be made
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - database
        - checked_at
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
        service:
          type: string
          const: instant-chat-api
        database:
          type: string
          enum:
            - healthy
            - unavailable
        checked_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - username
        - display_name
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          type: string
          minLength: 2
          maxLength: 80
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - email
        - display_name
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        username:
          $ref: "#/components/schemas/Username"
        email:
          type: string
          format: email
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
    ResourceID:
      type: string
      pattern: "^[1-9][0-9]*$"
    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: "^[a-z][a-z0-9_]{2,31}$"
    PublicUser:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - display_name
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
    SendContactRequest:
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          $ref: "#/components/schemas/Username"
    ContactRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - user
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        user:
          $ref: "#/components/schemas/PublicUser"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactRequestLists:
      type: object
      additionalProperties: false
      required:
        - incoming
        - outgoing
      properties:
        incoming:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ContactRequest"
        outgoing:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ContactRequest"
    Contact:
      type: object
      additionalProperties: false
      required:
        - relationship_id
        - user
        - connected_at
      properties:
        relationship_id:
          $ref: "#/components/schemas/ResourceID"
        user:
          $ref: "#/components/schemas/PublicUser"
        connected_at:
          type: string
          format: date-time
    ContactList:
      type: object
      additionalProperties: false
      required:
        - contacts
      properties:
        contacts:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Contact"
    CreateConversationRequest:
      type: object
      additionalProperties: false
      required:
        - contact_user_id
      properties:
        contact_user_id:
          $ref: "#/components/schemas/ResourceID"
    Conversation:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - peer
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        kind:
          type: string
          const: direct
        peer:
          $ref: "#/components/schemas/PublicUser"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationList:
      type: object
      additionalProperties: false
      required:
        - conversations
      properties:
        conversations:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Conversation"
    Session:
      type: object
      additionalProperties: false
      required:
        - user
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
