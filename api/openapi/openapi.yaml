openapi: 3.1.0
info:
  title: Instant Chat API
  version: 0.9.0
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API and database health
      responses:
        "200":
          description: API and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: API is running but its database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/register:
    post:
      operationId: register
      summary: Create an account and initial session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "409":
          description: An account already uses the username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke an access and refresh token pair
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Session revoked
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the user for the current access token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateCurrentUserProfile
      summary: Update the current user's editable profile fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me/avatar:
    put:
      operationId: updateCurrentUserAvatar
      summary: Replace the current user's profile photo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/{user_id}/avatar:
    get:
      operationId: getUserAvatar
      summary: Download one authenticated user's profile photo
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceID"
      responses:
        "200":
          description: Profile image bytes
          content:
            image/png: {}
            image/jpeg: {}
            image/gif: {}
            image/webp: {}
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/search:
    get:
      operationId: searchUserByUsername
      summary: Find one account by exact username
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Username"
      responses:
        "200":
          description: Exact username match
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /contact-requests:
    get:
      operationId: listContactRequests
      summary: List incoming and outgoing pending contact requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending contact requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequestLists"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: sendContactRequest
      summary: Send a contact request by exact username
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendContactRequest"
      responses:
        "201":
          description: Contact request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequest"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /contact-requests/{request_id}/accept:
    post:
      operationId: acceptContactRequest
      summary: Accept an incoming contact request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Accepted contact with its direct conversation created or reactivated for both users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /contact-requests/{request_id}/reject:
    post:
      operationId: rejectContactRequest
      summary: Reject an incoming contact request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "204":
          description: Contact request rejected
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /contact-requests/{request_id}/cancel:
    post:
      operationId: cancelContactRequest
      summary: Cancel an outgoing contact request
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "204":
          description: Contact request canceled
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /contacts:
    get:
      operationId: listContacts
      summary: List accepted contacts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accepted contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /contacts/{user_id}:
    delete:
      operationId: removeContact
      summary: Delete an accepted contact and suspend the direct chat
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Contact deleted and direct chat hidden with history preserved
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations:
    get:
      operationId: listConversations
      summary: List direct conversations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Direct conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createDirectConversation
      summary: Create or return the direct conversation for a contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "200":
          description: Existing direct conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "201":
          description: Direct conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{conversation_id}/messages:
    get:
      operationId: listMessages
      summary: List a page of direct-conversation messages
      description: The before and after cursors are mutually exclusive.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - name: before
          in: query
          required: false
          description: Return messages with a sequence lower than this cursor
          schema:
            $ref: "#/components/schemas/Sequence"
        - name: after
          in: query
          required: false
          description: Return messages with a sequence higher than this cursor for reconnect recovery
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Message history in ascending sequence order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: sendMessage
      summary: Persist one direct text message
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Idempotent retry returned the existing message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{conversation_id}/messages/{message_id}:
    delete:
      operationId: deleteMessageForCurrentUser
      summary: Hide one message only for the current user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Message hidden for the current user
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{conversation_id}/messages/{message_id}/recall:
    post:
      operationId: recallMessage
      summary: Recall the sender's message within five minutes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Message recalled for every conversation member
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{conversation_id}/read:
    post:
      operationId: markConversationRead
      summary: Mark direct-conversation messages as read through a sequence
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkConversationReadRequest"
      responses:
        "204":
          description: Read state was recorded
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{conversation_id}/messages/images:
    post:
      operationId: sendImageMessage
      summary: Persist one direct image message
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SendImageMessageRequest"
      responses:
        "200":
          description: Idempotent retry returned the existing message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{conversation_id}/messages/files:
    post:
      operationId: sendFileMessage
      summary: Persist one direct file message
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SendFileMessageRequest"
      responses:
        "200":
          description: Idempotent retry returned the existing message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /message-images/{image_id}:
    get:
      operationId: getMessageImage
      summary: Return one authorized message image
      security:
        - bearerAuth: []
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceID"
      responses:
        "200":
          description: Image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /message-files/{file_id}:
    get:
      operationId: getMessageFile
      summary: Return one authorized message file
      security:
        - bearerAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceID"
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /realtime:
    get:
      operationId: connectRealtime
      summary: Open the authenticated realtime message stream
      description: >
        Upgrade to WebSocket. The server sends versioned JSON text events and
        uses ping and pong frames to detect stale connections.
      security:
        - bearerAuth: []
      x-websocket-events:
        - $ref: "#/components/schemas/MessageCreatedEvent"
        - $ref: "#/components/schemas/MessageRecalledEvent"
      responses:
        "101":
          description: WebSocket connection established
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RequestID:
      name: request_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceID"
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceID"
    ConversationID:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceID"
    MessageID:
      name: message_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceID"
  responses:
    InvalidArgument:
      description: The request body or fields are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Credentials or a session token are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated account cannot perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current relationship state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests from this IP address
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before another attempt should be made
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - database
        - checked_at
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
        service:
          type: string
          const: instant-chat-api
        database:
          type: string
          enum:
            - healthy
            - unavailable
        checked_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - display_name
        - password
      properties:
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          type: string
          minLength: 2
          maxLength: 80
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - display_name
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          type: string
        gender:
          type:
            - string
            - "null"
          enum:
            - female
            - male
            - non_binary
            - prefer_not_to_say
            - null
        region:
          type:
            - string
            - "null"
          maxLength: 80
        avatar_url:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
    ResourceID:
      type: string
      pattern: "^[1-9][0-9]*$"
    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: "^[a-z][a-z0-9_]{2,31}$"
    PublicUser:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - display_name
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          type: string
        avatar_url:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/User"
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - display_name
      properties:
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          type: string
          minLength: 2
          maxLength: 80
        gender:
          type:
            - string
            - "null"
          enum:
            - female
            - male
            - non_binary
            - prefer_not_to_say
            - null
        region:
          type:
            - string
            - "null"
          maxLength: 80
    SendContactRequest:
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          $ref: "#/components/schemas/Username"
    ContactRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - user
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        user:
          $ref: "#/components/schemas/PublicUser"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactRequestLists:
      type: object
      additionalProperties: false
      required:
        - incoming
        - outgoing
      properties:
        incoming:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ContactRequest"
        outgoing:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ContactRequest"
    Contact:
      type: object
      additionalProperties: false
      required:
        - relationship_id
        - user
        - connected_at
      properties:
        relationship_id:
          $ref: "#/components/schemas/ResourceID"
        user:
          $ref: "#/components/schemas/PublicUser"
        connected_at:
          type: string
          format: date-time
    ContactList:
      type: object
      additionalProperties: false
      required:
        - contacts
      properties:
        contacts:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Contact"
    CreateConversationRequest:
      type: object
      additionalProperties: false
      required:
        - contact_user_id
      properties:
        contact_user_id:
          $ref: "#/components/schemas/ResourceID"
    Conversation:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - peer
        - created_at
        - updated_at
        - unread_count
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        kind:
          type: string
          const: direct
        peer:
          $ref: "#/components/schemas/PublicUser"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        unread_count:
          type: integer
          minimum: 0
        last_message:
          allOf:
            - $ref: "#/components/schemas/ConversationLastMessage"
          nullable: true
    ConversationLastMessage:
      type: object
      additionalProperties: false
      required:
        - sequence
        - kind
        - body
        - file_name
      properties:
        sequence:
          $ref: "#/components/schemas/Sequence"
        kind:
          type: string
          enum: [text, image, file]
        body:
          type: string
        file_name:
          type: string
    ConversationList:
      type: object
      additionalProperties: false
      required:
        - conversations
      properties:
        conversations:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Conversation"
    ClientMessageID:
      type: string
      pattern: "^[a-f0-9]{32}$"
    Sequence:
      type: string
      pattern: "^[1-9][0-9]*$"
    MarkConversationReadRequest:
      type: object
      additionalProperties: false
      required:
        - sequence
      properties:
        sequence:
          $ref: "#/components/schemas/Sequence"
    SendMessageRequest:
      type: object
      additionalProperties: false
      required:
        - client_message_id
        - body
      properties:
        client_message_id:
          $ref: "#/components/schemas/ClientMessageID"
        body:
          type: string
          minLength: 1
          maxLength: 4000
        reply_to_message_id:
          description: The message in this conversation being replied to.
          $ref: "#/components/schemas/ResourceID"
    SendImageMessageRequest:
      type: object
      additionalProperties: false
      required:
        - client_message_id
        - image
      properties:
        client_message_id:
          $ref: "#/components/schemas/ClientMessageID"
        image:
          type: string
          format: binary
          description: PNG, JPEG, GIF, or WebP image up to 15 MB.
    SendFileMessageRequest:
      type: object
      additionalProperties: false
      required:
        - client_message_id
        - file
      properties:
        client_message_id:
          $ref: "#/components/schemas/ClientMessageID"
        file:
          type: string
          format: binary
          description: File up to 2 GB.
    MessageImage:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - content_type
        - byte_size
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        url:
          type: string
        content_type:
          type: string
          enum:
            - image/gif
            - image/jpeg
            - image/png
            - image/webp
        byte_size:
          type: integer
          minimum: 1
          maximum: 15728640
    MessageFile:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - filename
        - content_type
        - byte_size
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        url:
          type: string
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
        byte_size:
          type: integer
          minimum: 1
          maximum: 2147483648
    Message:
      type: object
      additionalProperties: false
      required:
        - id
        - conversation_id
        - sender
        - client_message_id
        - sequence
        - kind
        - body
        - image
        - file
        - reply_to
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        conversation_id:
          $ref: "#/components/schemas/ResourceID"
        sender:
          $ref: "#/components/schemas/PublicUser"
        client_message_id:
          $ref: "#/components/schemas/ClientMessageID"
        sequence:
          $ref: "#/components/schemas/Sequence"
        kind:
          type: string
          enum:
            - text
            - image
            - file
        body:
          type: string
          maxLength: 4000
        image:
          oneOf:
            - $ref: "#/components/schemas/MessageImage"
            - type: "null"
        file:
          oneOf:
            - $ref: "#/components/schemas/MessageFile"
            - type: "null"
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/MessageReply"
            - type: "null"
        recalled_at:
          description: >
            The time the message was recalled. Recalled messages have no body
            or attachment metadata and are rendered as an action notice.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        created_at:
          type: string
          format: date-time
    MessageReply:
      type: object
      additionalProperties: false
      required:
        - id
        - sender
        - kind
        - body
        - filename
        - recalled_at
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        sender:
          $ref: "#/components/schemas/PublicUser"
        kind:
          type: string
          enum:
            - text
            - image
            - file
        body:
          type: string
          maxLength: 4000
        filename:
          type: string
          maxLength: 255
        recalled_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    MessagePage:
      type: object
      additionalProperties: false
      required:
        - messages
        - next_cursor
      properties:
        messages:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          description: >
            The next before cursor for history or next after cursor for
            reconnect recovery; null when that direction is complete.
          oneOf:
            - $ref: "#/components/schemas/Sequence"
            - type: "null"
    MessageCreatedEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - type
        - version
        - occurred_at
        - payload
      properties:
        event_id:
          type: string
          pattern: "^message:[1-9][0-9]*$"
        type:
          type: string
          const: message.created
        version:
          type: integer
          const: 1
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: false
          required:
            - message
          properties:
            message:
              $ref: "#/components/schemas/Message"
    MessageRecalledEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - type
        - version
        - occurred_at
        - payload
      properties:
        event_id:
          type: string
          pattern: "^message-recalled:[1-9][0-9]*$"
        type:
          type: string
          const: message.recalled
        version:
          type: integer
          const: 1
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: false
          required:
            - recall
          properties:
            recall:
              type: object
              additionalProperties: false
              required:
                - conversation_id
                - message_id
              properties:
                conversation_id:
                  $ref: "#/components/schemas/ResourceID"
                message_id:
                  $ref: "#/components/schemas/ResourceID"
    Session:
      type: object
      additionalProperties: false
      required:
        - user
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
